version: 1.0.{build}
clone_depth: 5
clone_folder: C:\projects\mir2

image: Visual Studio 2022

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

configuration:
  - Debug

before_build:
  - cmd: dotnet --info
  # PatcherWebSite is a legacy ASP.NET Website project (.NETFramework v4.8) that
  # only the Framework MSBuild can compile — dotnet CLI can't. mir2.slnf includes
  # only the .NET SDK projects so `dotnet` doesn't trip over it.
  - cmd: dotnet restore mir2.slnf

build_script:
  - cmd: dotnet build mir2.slnf -c %CONFIGURATION% --no-restore

# Stage each subsystem into dist\<role>\ then archive one .7z per role.
# BaseOutputPath from the csprojs sends most outputs under Build\;
# AutoPatcherAdmin* have no BaseOutputPath so we pull them from their own bin\.
after_build:
  - cmd: if not exist Build (echo Build directory missing && exit 1)

  - cmd: mkdir dist
  - cmd: mkdir dist\Client
  - cmd: mkdir dist\Server
  - cmd: mkdir "dist\ServerTools"
  - cmd: mkdir dist\Patcher

  - cmd: xcopy /E /I /Y "Build\Client\%CONFIGURATION%\*"                       dist\Client\
  - cmd: xcopy /E /I /Y "Build\Server\%CONFIGURATION%\*"                       dist\Server\
  - cmd: xcopy /E /I /Y "Build\Server Tools\LibraryEditor\%CONFIGURATION%\*"   "dist\ServerTools\LibraryEditor\"
  - cmd: xcopy /E /I /Y "Build\Server Tools\LibraryViewer\%CONFIGURATION%\*"   "dist\ServerTools\LibraryViewer\"
  - cmd: xcopy /E /I /Y "AutoPatcherAdmin\bin\%CONFIGURATION%\*"               dist\Patcher\AutoPatcherAdmin\
  - cmd: xcopy /E /I /Y "AutoPatcherAdminV2\bin\%CONFIGURATION%\*"             dist\Patcher\AutoPatcherAdminV2\

  - cmd: pushd dist && 7z a -r "..\mir2-Client-%APPVEYOR_BUILD_NUMBER%.7z"      Client\*      && popd
  - cmd: pushd dist && 7z a -r "..\mir2-Server-%APPVEYOR_BUILD_NUMBER%.7z"      Server\*      && popd
  - cmd: pushd dist && 7z a -r "..\mir2-ServerTools-%APPVEYOR_BUILD_NUMBER%.7z" ServerTools\* && popd
  - cmd: pushd dist && 7z a -r "..\mir2-Patcher-%APPVEYOR_BUILD_NUMBER%.7z"     Patcher\*     && popd

artifacts:
  - path: mir2-Client-$(APPVEYOR_BUILD_NUMBER).7z
    name: mir2-Client
  - path: mir2-Server-$(APPVEYOR_BUILD_NUMBER).7z
    name: mir2-Server
  - path: mir2-ServerTools-$(APPVEYOR_BUILD_NUMBER).7z
    name: mir2-ServerTools
  - path: mir2-Patcher-$(APPVEYOR_BUILD_NUMBER).7z
    name: mir2-Patcher
