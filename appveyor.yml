version: 1.0.{build}
clone_depth: 5
clone_folder: C:\projects\mir2

image: Visual Studio 2022

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

configuration:
  - Debug

before_build:
  - cmd: dotnet --info
  - cmd: dotnet restore "Legend of Mir.sln"

build_script:
  - cmd: dotnet build "Legend of Mir.sln" -c %CONFIGURATION% --no-restore

after_build:
  # Real binaries live under Build\ (per each csproj's BaseOutputPath).
  # Package the compiled output, NOT the source tree.
  - cmd: if not exist Build (echo Build directory missing && exit 1)
  - cmd: 7z a -r "mir2_%CONFIGURATION%_%APPVEYOR_BUILD_NUMBER%.7z" Build

artifacts:
  - path: mir2_$(CONFIGURATION)_$(APPVEYOR_BUILD_NUMBER).7z
    name: mir2-binaries
  - path: Build
    name: mir2-build-tree
    type: zip
